
# security_hardening M1 -- CORS trusted-origin allowlist (replaces a blanket "*").
#
# $cors_origin reflects the request's Origin ONLY if it is one this deployment serves;
# anything else maps to the empty string, and nginx omits an add_header whose value is
# empty. So an untrusted origin now receives NO Access-Control-Allow-Origin header at
# all, rather than a wildcard that let any website on the internet read the API.
#
# This file is included from the http{} block of nginx.conf via sites-enabled/*.conf,
# so `map` is legal here. Add an origin by adding a line -- include the scheme, and no
# trailing slash. Both LB hostnames are listed because :443 and :80 disagree (see N1).
map $http_origin $cors_origin {
    default                                        "";
    "https://test_staging.languagetechnology.org"  $http_origin;
    "https://testing.languagetechnology.org"       $http_origin;
    "https://s-dokimion.psonet"                    $http_origin;
}

# dns name resolver
#resolver 10.0.0.1 valid=10s;

# HTTPS upgrade (https_upgrade.md Step 4): redirect plain HTTP to HTTPS instead of serving
# content over plaintext. This dedicated :80 server answers any direct HTTP request with a 301
# to the HTTPS URL; the real vhost below is HTTPS-only.
server {
    listen 80;
    include sites-available/server_name.h;
    return 301 https://$host$request_uri;
}

server {
    include sites-available/server_name.h;
    # HTTPS upgrade (https_upgrade.md Step 1): TLS listener serving the Option A shared SAN cert
    # (covers dokimion1/2/3.psonet) so the LB can keep proxy_ssl_verify on with one trusted
    # cert + proxy_ssl_name.
    listen 443 ssl;
    include sites-available/webserver_cert.h;
    ssl_protocols TLSv1.2 TLSv1.3;

    # security_hardening H1 (part 1): source restriction. Only the load balancer may
    # reach this backend directly; anything else bypasses the LB's rate limiting,
    # security headers and the Cloudflare/WAF layer in front of it. The allowed IP
    # differs per environment, so it lives in a per-host include.
    include sites-available/lb_access.h;

    # security_hardening H1 (part 2): mutual TLS. Makes "only the LB may connect"
    # cryptographic rather than address-based, completing the symmetric trust the LB
    # already has via proxy_ssl_verify. Empty until the internal CA and LB client
    # cert from H2 exist.
    include sites-available/lb_mtls.h;

    # server name in "Host" request header or the primary
    # server name
    proxy_set_header Host $host;
    proxy_set_header Connection "";
        
    proxy_read_timeout     5m;
    proxy_connect_timeout  300;
    proxy_http_version     1.1;

    # compression of server responses
    gzip on;
    gzip_types      text/plain application/xml application/json;
    gzip_proxied    no-cache no-store private expired auth;
    gzip_min_length 1000;

    root /usr/dokimion/dokimion/src/public;
    index index.html index.htm;

    error_log /var/log/nginx/error.log;

    # security_hardening M1: the blanket `add_header Access-Control-Allow-Origin *;` that
    # used to sit here has been removed. It was inherited by `location /`, which serves this
    # app's own HTML/JS to its own origin and needs no CORS header. `location /api` defines
    # its own add_header set, so nginx never inherited this one there.
    location / {

        resolver 10.0.0.1 8.8.8.8 valid=30s;
	resolver_timeout 10s;
        set $empty "";

        # asynchronous thread pools
        aio threads;

        # maximum number of requests that can be served through 1
        # keep alive connection
        keepalive_requests 100;

        # number and size of the buffers used for reading a response
        # from the proxied server
        proxy_buffers 16 16k;
        # size of buffer used for reading the first part of the response
        # received from the proxied server
        proxy_buffer_size 4k;

        #proxy_pass http://dokimion1.psonet$empty:3000/;
        proxy_pass http://127.0.0.1:3000/;

        # security_hardening M1 (part 2): the UI upstream on :3000 sets its OWN
        # `Access-Control-Allow-{Origin,Methods,Headers}: *` on every response, and nginx
        # passes upstream response headers through untouched -- so removing nginx's own
        # server-level wildcard was not enough on its own. Strip them here: `location /`
        # serves this app's SPA to its own origin and needs no CORS headers at all.
        # Verified: without these, `curl -H 'Origin: https://evil.example.com' /` still
        # returned `Access-Control-Allow-Origin: *` after the nginx-side fix.
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Access-Control-Allow-Methods;
        proxy_hide_header Access-Control-Allow-Headers;
	proxy_buffering on;
	# server name in "Host" request header or the primary
        # server name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
    
    location /api {

        resolver 10.0.0.1 8.8.8.8 ipv6=off valid=30s;
	resolver_timeout 10s;

        set $empty "";

        # asynchronous thread pools
        aio threads;

        # number and size of the buffers used for reading a response
        # from the proxied server
        proxy_buffers 16 16k;
        # size of buffer used for reading the first part of the response
        # received from the proxied server
        proxy_buffer_size 4k;

        #proxy_pass http://dokimion1$empty:8080/api;
        proxy_pass http://127.0.0.1:8080/api;
	proxy_buffering on;
        # server name in "Host" request header or the primary
        # server name
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;

        access_log /var/log/nginx/access.log;
        error_log /var/log/nginx/error.log;
        proxy_redirect          off;
        proxy_connect_timeout   60s;

        # allow resource sharing between sites using CORS header
        add_header Access-Control-Allow-Methods "GET,PUT,OPTIONS,POST,DELETE";
	add_header Access-Control-Allow-Origin $cors_origin;
        # The response body now depends on the request's Origin, so it must not be served
        # from cache to a different origin. Required whenever ACAO is reflected rather than
        # constant -- gzip/proxy_buffering are on for this location.
        add_header Vary Origin;
	add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Max-Age "86400";
    }

}


