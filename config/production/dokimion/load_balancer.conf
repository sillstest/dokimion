
resolver 10.0.0.1 ipv6=off valid=10s;

include /etc/nginx/sites-available/servers.h;

client_body_timeout   1m; # or 60s
client_header_timeout 1m;
send_timeout          1m;

log_format custom '$remote_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';

# Rate Limiting
# General request rate: 10 req/sec per IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Stricter zone for sensitive/auth endpoints: 5 req/min per IP
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;

# Connection limiting: max 20 concurrent connections per IP
limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

server {
        listen 443 ssl ipv6only=off;
        http2 on;

        include /etc/nginx/sites-available/certificates.h;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites (TLS 1.3 ciphers are managed a
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
	ssl_prefer_server_ciphers off; # Let client pick among your approved ciphers; 'off' is correct for TLS 1.3

        # Session caching (improves handshake performance)
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off; # Disable unless you rotate

        # OCSP Stapling - supported by cloudflare
        
        # Reduce buffer size to improve TTFB for typical web
        ssl_buffer_size 4k;

        # HSTS — tells browsers to always use HTTPS (1 year)
        #
        # security_hardening L2: `preload` dropped 2026-08-03. Sending it advertised intent
        # to join the browser preload list, which is baked into browser binaries and is slow
        # and painful to reverse -- and with `includeSubDomains` it would have bound every
        # host under languagetechnology.org, staging included. The header was being sent from
        # both LBs despite the "remove while testing" note directly above. `max-age` and
        # `includeSubDomains` are kept: those are the parts that actually enforce HTTPS, and
        # both are reversible by changing this line.
        #
        # Only re-add `preload` as a deliberate decision to submit the domain at
        # hstspreload.org, and only after confirming every subdomain is HTTPS-only.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Additional security headers (bonus)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        access_log /var/log/nginx/access.log custom;
        error_log /var/log/nginx/error.log warn;

        include /etc/nginx/sites-available/server_name.h;

	location / {

           include /etc/nginx/sites-available/rate_limiting.h;

           resolver 10.0.0.1 8.8.8.8 ipv6=off valid=300s;
           resolver_timeout 10s;
           set $empty "";

	   # asynchronous thread pools
           aio threads;


          # allows redefining or appending fields to the request
          # header passed to the proxied server
	  proxy_buffering on;
          proxy_http_version 1.1;
          proxy_set_header Upgrade $http_upgrade;
          proxy_set_header Connection "upgrade";
          proxy_set_header Host $host;
          proxy_cache_bypass $http_upgrade;
          proxy_read_timeout 300;
          proxy_send_timeout 300;
          proxy_connect_timeout 300;

          # passes real ip in header to upstream server
          proxy_set_header X-Real-IP $remote_addr;
          # automatically appends $remote_addr to any incoming
          # X-Forwarded-For headers
          proxy_set_header X-Forwarded-for $proxy_add_x_forwarded_for;


          # number and size of the buffers used for reading a response
          # from the proxied server
          proxy_buffers 16 16k;
          # size of buffer used for reading the first part of the response
          # received from the proxied server
          proxy_buffer_size 4k;

          proxy_ssl_server_name on;            # send SNI so the web server selects its cert
          proxy_ssl_protocols   TLSv1.2 TLSv1.3;
          proxy_ssl_verify on;
          proxy_ssl_verify_depth 1;             # self-signed leaf = its own anchor, no chain

          # security_hardening H1 (part 2): the client certificate this LB presents to
          # the upstreams, so they can authenticate it (ssl_verify_client on the web
          # servers). Cert paths are per-environment. Empty until the cert is issued.
          include /etc/nginx/sites-available/lb_client_cert.h;

          include /etc/nginx/sites-available/proxy_pass.h;

	}
}

server {
        listen 80 ipv6only=off;

        include /etc/nginx/sites-available/http_return.h;

        # security_hardening L1: no slash between $host and $request_uri --
        # $request_uri already carries its own leading slash, so "$host/$request_uri"
        # emitted https://host//path. Verified live 2026-07-29 before the fix:
        # http://testing.languagetechnology.org/ -> 301 https://testing.languagetechnology.org//
        return 301 https://$host$request_uri;

}


