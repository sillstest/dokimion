# Dokimion all-in-one: serve the React build; proxy /api to jetty-runner on :8080.
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/dokimion;
    index index.html;

    client_max_body_size 50m;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # container/LB health check — 200 without touching the app
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # API -> jetty-runner (quack.war) on loopback :8080
    location /api {
        proxy_pass         http://127.0.0.1:8080/api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 60s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
