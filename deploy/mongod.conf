# mongod.conf for the Dokimion mongo container.
# Patterned after dokimion-mongodb.psonet:/etc/mongod.conf
# (tracked copy: config/production/dokimion-mongodb/mongod.conf), adapted for the container
# runtime. Lines that differ from dokimion-mongodb are flagged "CONTAINER:".

# for documentation of all options, see:
#   http://docs.mongodb.org/manual/reference/configuration-options/

# Where and how to store data.
storage:
  # CONTAINER: the official image's data volume is /data/db (dokimion-mongodb: /var/lib/mongodb).
  dbPath: /data/db
  wiredTiger:
    engineConfig:
      # CONTAINER: dokimion-mongodb used 16 GB. Size this to THIS container's memory limit
      # (rule of thumb ~50% of the container RAM). 1 GB is a safe default; raise it.
      cacheSizeGB: 1

# where to write logging data.
# CONTAINER: no systemLog block -> mongod logs to stdout, so `docker logs` / `kubectl logs`
# capture it. dokimion-mongodb instead logged to a file:
#   systemLog:
#     destination: file
#     logAppend: true
#     path: /var/log/mongodb/mongod.log

# network interfaces
net:
  port: 27017
  # CONTAINER: listen on all interfaces so other containers can reach it (equivalent to
  # --bind_ip_all). dokimion-mongodb bound to 127.0.0.1,dokimion-mongodb.psonet.
  bindIp: 0.0.0.0

# how the process runs
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# CONTAINER NOTE: dokimion-mongodb runs WITH auth (authorization: enabled). The container Mongo
# currently runs WITHOUT auth. To match dokimion-mongodb, uncomment the block below AND create
# the 'dokimion' user in this Mongo with the password from quack.properties, or the app can't
# connect. Left disabled by default so the current setup keeps working.
#security:
#   authorization: enabled

#security:
  #keyFile: /opt/mongod-keyfile
  #transitionToAuth: true

#operationProfiling:

#replication:
  #replSetName: "rs1"

#sharding:
